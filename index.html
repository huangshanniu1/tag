const input = document.getElementById('promptInput');
const statusBar = document.getElementById('statusBar');
let selected = [];

function render(){
    const c = document.getElementById('categories');
    c.innerHTML = '';
    Object.keys(tagsData).forEach(cat => {
        const div = document.createElement('div'); div.className = 'tag-category';
        const header = document.createElement('div'); header.className = 'category-header';
        header.innerHTML = `${cat} (${tagsData[cat].length})<i class="fas fa-chevron-right"></i>`;
        header.onclick = () => header.classList.toggle('active');
        div.appendChild(header);

        const content = document.createElement('div'); content.className = 'subcategory-container';
        const list = document.createElement('div'); list.className = 'tag-list';
        tagsData[cat].forEach(t => {
            const tag = document.createElement('div'); tag.className = 'tag';
            tag.textContent = t.chinese;
            tag.dataset.en = t.english;
            tag.title = t.english;
            tag.onclick = () => {
                tag.classList.toggle('active');
                if(tag.classList.contains('active')) selected.push(t.english);
                else selected = selected.filter(x => x !== t.english);
                update();
            };
            list.appendChild(tag);
        });
        content.appendChild(list); div.appendChild(content); c.appendChild(div);
    });
}
render();

function update(){
    const text = selected.join(', ');
    input.value = text;
    document.getElementById('count').textContent = selected.length;
    document.getElementById('chars').textContent = text.length;
    statusBar.innerHTML = '<strong>已选标签：</strong> ';
    if(selected.length===0) statusBar.innerHTML += '<span class="no-tags">暂无标签</span>';
    else selected.forEach(en => {
        const s = document.createElement('span'); s.className='status-tag';
        s.textContent = en;
        s.onclick = () => {
            selected = selected.filter(x=>x!==en);
            update();
            document.querySelectorAll(`.tag[data-en="${en}"]`).forEach(t=>t.classList.remove('active'));
        };
        statusBar.appendChild(s);
    });
}

document.getElementById('copyBtn').onclick = () => { navigator.clipboard.writeText(input.value); alert('已复制全部英文标签！'); };
document.getElementById('clearBtn').onclick = () => { selected=[]; update(); document.querySelectorAll('.tag.active').forEach(t=>t.classList.remove('active')); };
document.getElementById('expandBtn').onclick = () => document.querySelectorAll('.category-header').forEach(h=>h.classList.add('active'));
document.getElementById('collapseBtn').onclick = () => document.querySelectorAll('.category-header').forEach(h=>h.classList.remove('active'));

let timer;
document.getElementById('searchInput').addEventListener('input', e => {
    clearTimeout(timer);
    timer = setTimeout(() => {
        const q = e.target.value.toLowerCase();
        document.querySelectorAll('.tag').forEach(t => {
            const txt = (t.textContent + t.dataset.en).toLowerCase();
            t.style.display = txt.includes(q) ? '' : 'none';
        });
    }, 200);
});

document.getElementById('themeToggle').onclick = () => {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('dark', document.body.classList.contains('dark-mode'));
};
if(localStorage.getItem('dark')==='true') document.body.classList.add('dark-mode');

update();
</script>
